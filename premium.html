<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iZítra.cz</title>
    <link rel="icon" href="images/cool.png" type="image/png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="subscription-container">
        <div class="subscription-header">
            <h1>Získat členství</h1>
            <a href="index.html" class="close-button">×</a>
        </div>
        
        <div class="subscription-tabs">
            <button class="tab active">Měsíční předplatné</button>
            <button class="tab">Daruj roční</button>
            <button class="tab">Daruj dvouleté</button>
        </div>
        
        <div class="price-display">
            <div class="price-label">První měsíc jen</div>
            <div class="price">49 Kč</div>
            <div class="next-payment">Příští opakovaná platba 17. 12. 2024 za 89 Kč/měsíc</div>
        </div>
        
        <div class="payment-options">
            <label class="payment-option">
                <input type="radio" name="payment" checked>
                <span>Platba kartou</span>
            </label>
            <label class="payment-option">
                <input type="radio" name="payment">
                <span>Google Pay</span>
            </label>
            <label class="payment-option">
                <input type="radio" name="payment">
                <span>Apple Pay</span>
            </label>
            <label class="payment-option">
                <input type="radio" name="payment">
                <span>Platba přes SMS</span>
            </label>
        </div>
        
        <a href="#" class="coupon-link">Chci uplatnit svůj kupón</a>
        
        <a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ&autoplay=1">
            <button class="submit-button">OBJEDNAT PREMIUM</button>
        </a>
        
        <div class="terms">
            Kliknutím na tlačítko souhlasíte s uložením svých platebních údajů v platební bráně GoPay.
        </div>
    </div>
    </body>
</html>
